beholder {
  api.key = "foo"
  api.key = ${?BEHOLDER_API_KEY}
  capture {
    # How many ffmpeg processes may run at once. ffmpeg is itself multi-threaded, so this is
    # deliberately well below the CPU count. 0 = auto (a quarter of the processors, at least 2).
    threads = 0
    threads = ${?BEHOLDER_CAPTURE_THREADS}
    # How many requests may wait for a worker before the service starts answering 503.
    # 0 = auto (8 per thread).
    queuesize = 0
    queuesize = ${?BEHOLDER_CAPTURE_QUEUESIZE}
    # How long a request may wait for a worker before it is discarded instead of run. Nothing
    # cancels a queued capture, so without this a client that gave up still costs a full ffmpeg
    # run when its turn comes, while live requests wait behind it. Keep it under the timeout your
    # clients use. 0 = no deadline (queued work always runs, however long it waited).
    maxwait = 15s
    maxwait = ${?BEHOLDER_CAPTURE_MAXWAIT}
  }
  cache {
    size = 500
    size = ${?BEHOLDER_CACHE_SIZE} # size in MB
    freepct = 0.20                   
    freepct = ${?BEHOLDER_CACHE_FREEPCT} # free space in % when cache is full
  }
  ffmpeg {
    path = "ffmpeg"
    path = ${?BEHOLDER_FFMPEG_PATH}
    timeout = 60s # a capture that runs longer than this is killed
    timeout = ${?BEHOLDER_FFMPEG_TIMEOUT}
  }
  ffprobe {
    cache {
      maxcount = 20000 # max number of files in cache
      maxcount = ${?BEHOLDER_FFPROBE_CACHE_MAXCOUNT}
      expire = 12h
      expire = ${?BEHOLDER_FFPROBE_CACHE_EXPIRE} # expire time for cache entries
    }
    path = "ffprobe"
    path = ${?BEHOLDER_FFPROBE_PATH}
    timeout = 30s # a probe that runs longer than this is killed
    timeout = ${?BEHOLDER_FFPROBE_TIMEOUT}
  }
  http {
    port = 8080
    port = ${?BEHOLDER_HTTP_PORT}
  }
}